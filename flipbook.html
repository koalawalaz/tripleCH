      'heart': '<svg viewBox="0 0 24 24" stroke="var(--gold)" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.2 C12 20.2 4 14.3 4 8.6 C4 5.7 6.3 3.6 9 3.6 C10.6 3.6 11.6 4.4 12 5.4 C12.4 4.4 13.4 3.6 15 3.6 C17.7 3.6 20 5.7 20 8.6 C20 14.3 12 20.2 12 20.2 Z"></path></svg>',
      'club': '<svg viewBox="0 0 24 24" stroke="var(--green)" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9.6" r="3.3"></circle><circle cx="15" cy="9.6" r="3.3"></circle><circle cx="12" cy="14.4" r="3.3"></circle><path d="M12 16.8 L12 21"></path><path d="M9 21 L15 21"></path></svg>'
    };
    return svgs[type] || svgs['default'];
  }

  function classifyHeaderIcon(headerText) {
    var t = headerText.toLowerCase();
    // Ordered most-specific-first — this maps chapter headers onto the
    // book's own game vocabulary (cube, suits, dice, chess) rather than
    // generic abstract icons, per the "each part of the book shows you
    // part of the game" request. The four suit-chapter openers get checked
    // before anything else since their subtitles often also name a king,
    // a cube or a board in passing ("The Club: ...and the King It Can
    // Cost") — the chapter is still about its suit first. Each suit gets
    // its own icon/color (not a shared generic card) — kicker text is
    // invariant across every page in a section (see addKickerIcon), so
    // this one check alone covers every page of that suit's chapter.
    if (t.indexOf('the diamond:') !== -1) return 'diamond';
    if (t.indexOf('the spade:') !== -1) return 'spade';
    if (t.indexOf('the heart:') !== -1) return 'heart';
    if (t.indexOf('the club:') !== -1) return 'club';
    if (t.indexOf('queen') !== -1) return 'queen';
    if (t.indexOf('king') !== -1 || t.indexOf('enlighten') !== -1) return 'king';
    if (t.indexOf('box') !== -1) return 'box';
    if (t.indexOf('practice') !== -1 || t.indexOf('audit') !== -1 || t.indexOf('weekly') !== -1 || t.indexOf('troubleshoot') !== -1) return 'practice';
    if (t.indexOf('cube') !== -1 || t.indexOf('spin') !== -1 || t.indexOf('rotat') !== -1 || t.indexOf('chaos') !== -1 || t.indexOf('six faces') !== -1) return 'cube';
    if (t.indexOf('formation') !== -1 || t.indexOf('board') !== -1) return 'board';
    if (t.indexOf('dice') !== -1 || t.indexOf('die becomes') !== -1 || t.indexOf(' die ') !== -1 || t.indexOf('roll') !== -1 || t.indexOf('probability') !== -1 || t.indexOf('formula') !== -1 || t.indexOf('pattern') !== -1) return 'dice';
    if (t.indexOf('suit') !== -1 || t.indexOf('diamond') !== -1 || t.indexOf('spade') !== -1 || t.indexOf('club') !== -1 || t.indexOf('card') !== -1 || t.indexOf('deck') !== -1 || t.indexOf('ace') !== -1 || t.indexOf('hand you were dealt') !== -1) return 'card';
    if (t.indexOf('introduction') !== -1 || t.indexOf('note') !== -1 || t.indexOf('how to') !== -1) return 'intro';
    if (t.indexOf('equation') !== -1 || t.indexOf('game') !== -1 || t.indexOf('piece') !== -1) return 'concept';
    if (t.indexOf('choice') !== -1 || t.indexOf('move') !== -1 || t.indexOf('action') !== -1) return 'practice';
    return 'default';
  }

  // The "Your Formation" / "Life's Formation" pages (Ch. 4) each devote one
  // whole page to a single specific piece, but every page in that run
  // shares the SAME kicker text ("Your Formation") — classifyHeaderIcon
  // alone can't tell them apart, and one page (the Failure/Castle page)
  // sits under a kicker ("The Queen of Anxiety's Actual Mechanism") that
  // would otherwise mislabel it as being about the Queen. Each page opens
  // with a small, consistent lead-in ("**Pawns, Hope.**", "**Failure**
  // doesn't...") that names its piece plainly, so match those exact
  // lead-ins instead of guessing from a shared section title — this is a
  // whitelist on purpose: loose keyword matching here would mislabel pages
  // that only mention a piece in passing (e.g. "Who You're Becoming: The
  // Face Cards" talks about the Queen and King without being *about*
  // either one specifically).
  var PIECE_CONTENT_LEADINS = [
    [/<strong>Pawns, Hope\.<\/strong>/, 'pawn'],
    [/<strong>Bishops, Knowledge\.<\/strong>/, 'bishop'],
    [/<strong>Knights, Self-Advocacy\.<\/strong>/, 'knight'],
    [/<strong>Castles, Support\.<\/strong>/, 'rook'],
    [/<strong>The Queen, Personal Responsibility\.<\/strong>/, 'queen'],
    [/<strong>The King, you\.<\/strong>/, 'king']
  ];
  function detectPieceIconFromContent(html) {
    if (!html) return null;
    for (var i = 0; i < PIECE_CONTENT_LEADINS.length; i++) {
      if (PIECE_CONTENT_LEADINS[i][0].test(html)) return PIECE_CONTENT_LEADINS[i][1];
    }
    // The obstacle-piece pages use a single bold word rather than the
    // "Piece, Concept." pattern above — Failure's page is cleanly about
    // one piece (the Castle), but Fear's page is a three-piece recap
    // (Fear/Confusion/Opposition together), so only fire when this page
    // names exactly the one obstacle and none of the others.
    var hasFailure = /<strong>Failure<\/strong>/.test(html);
    var hasFear = /<strong>Fear<\/strong>/.test(html);
    var hasConfusion = /<strong>Confusion<\/strong>/.test(html);
    var hasOpposition = /<strong>Opposition<\/strong>/.test(html);
    if (hasFailure && !hasFear && !hasConfusion && !hasOpposition) return 'rook';
    return null;
  }

  // The original book gives each of the six "Your/Life's Formation" pages
  // a full illustration: the piece rendered in line art, dissolving upward
  // into a scatter of particles — release, not loss. One shared particle
  // cloud (in the piece's native 24x24 coordinate space, extending above it
  // where every piece's silhouette tapers to a point) works for all six
  // pieces without hand-fitting a cluster to each individual shape.
  var PIECE_DISSOLVE_PARTICLES = [
    { x: 12.5, y: 2.0, r: 0.9, o: 0.85 },
    { x: 10.3, y: 0.4, r: 0.7, o: 0.75, gold: true },
    { x: 14.6, y: 0.1, r: 0.62, o: 0.7 },
    { x: 8.8, y: -1.6, r: 0.55, o: 0.6 },
    { x: 16.1, y: -1.9, r: 0.5, o: 0.55 },
    { x: 12.0, y: -3.1, r: 0.44, o: 0.48, gold: true },
    { x: 7.9, y: -4.1, r: 0.4, o: 0.4 },
    { x: 17.1, y: -4.3, r: 0.36, o: 0.36 },
    { x: 13.6, y: -5.6, r: 0.3, o: 0.3 },
    { x: 10.0, y: -6.6, r: 0.26, o: 0.24 },
    { x: 15.6, y: -7.1, r: 0.22, o: 0.19 },
    { x: 12.6, y: -8.4, r: 0.18, o: 0.14 },
    { x: 9.4, y: -9.1, r: 0.15, o: 0.1 },
    { x: 16.6, y: -9.4, r: 0.13, o: 0.08 }
  ];
  function pieceDissolveSvg(piece) {
    if (!PIECE_PATHS[piece]) return '';
    var particles = PIECE_DISSOLVE_PARTICLES.map(function (p) {
      var fill = p.gold ? 'var(--gold)' : 'var(--ink-soft)';
      return '<circle cx="' + p.x + '" cy="' + p.y + '" r="' + p.r + '" fill="' + fill + '" opacity="' + p.o + '"></circle>';
    }).join('');
    var art = '<g stroke="var(--ink)" stroke-width="1.15" fill="none" stroke-linecap="round" stroke-linejoin="round">' + PIECE_PATHS[piece] + '</g>';
    return '<svg class="piece-dissolve-svg" viewBox="-3 -11 30 47" aria-hidden="true">' + particles + art + '</svg>';
  }
  function addPieceDissolveArt(body, page, piece) {
    // Gated to exactly the six one-piece-per-page spreads (Ch. 4's "Your
    // Formation" / "Life's Formation" run) — detectPieceIconFromContent
    // also fires on the unrelated Failure/obstacle-mechanism page, which
    // isn't a dedicated piece showcase and shouldn't get the full treatment.
    if (!piece) return;
    if (page.kicker !== 'Your Formation' && page.kicker !== "Life's Formation") return;
    var svg = pieceDissolveSvg(piece);
    if (!svg) return;
    var wrap = document.createElement('div');
    wrap.className = 'piece-dissolve';
    wrap.innerHTML = svg;
    body.insertBefore(wrap, body.firstChild);
  }

  // The original book's other recurring illustration style: a single
  // continuous stroke, pen never lifted, for a reflective beat rather than
  // a diagram. The open box the King, the Pawn and everything else return
  // to — one path, drawn once at the Introduction (where it's a promise)
  // and once, identically, at the Epilogue (where it's a fact), so the two
  // ends of the book visually rhyme.
  var ONE_LINE_BOX_PATH = 'M20,20 L25,45 L25,80 L95,80 L95,45 L100,20 L95,45 L25,45';
  function oneLineBoxSvg() {
    return '<svg class="one-line-art" viewBox="0 0 120 92" aria-hidden="true">'
      + '<path d="' + ONE_LINE_BOX_PATH + '" pathLength="1" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>'
      + '</svg>';
  }
  function addOneLineBoxArt(body, page) {
    // kicker is shared across every page in a subsection (it's the running
    // head), so this must also require is_section_start — otherwise the
    // illustration would repeat on every page of the Introduction/Epilogue,
    // not just their opening page.
    if (!page || !page.kicker || !page.is_section_start) return;
    if (page.kicker.indexOf('The Box Is Already Waiting') === -1 && page.kicker.indexOf('The Same Box') === -1) return;
    var wrap = document.createElement('div');
    wrap.className = 'one-line-art-wrap';
    wrap.innerHTML = oneLineBoxSvg();
    body.insertBefore(wrap, body.firstChild);
  }

  function addSectionDividerMark(body) {
    var mark = document.createElement('div');
    mark.className = 'section-divider-mark';
    mark.innerHTML = '<svg viewBox="0 0 64 64" aria-hidden="true">'
      + '<polygon points="32,4 58,18 32,32 6,18"></polygon>'
      + '<polygon points="6,18 32,32 32,60 6,46"></polygon>'
      + '<polygon points="32,32 58,18 58,46 32,60"></polygon>'
      + '</svg>';
    body.insertBefore(mark, body.firstChild);
  }

  var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function typewriteText(el, text, speed) {
    if (reducedMotion || !text) { el.textContent = text; return; }
    el.textContent = '';
    el.classList.add('tw-typing');
    var i = 0;
    var step = function () {
      i += 1;
      el.textContent = text.slice(0, i);
      if (i < text.length) {
        setTimeout(step, speed || 26);
      } else {
        el.classList.remove('tw-typing');
        el.classList.add('tw-done');
      }
    };
    setTimeout(step, speed || 26);
  }

  function addKickerIcon(kickerEl, kickerText, contentOverride) {
    // Runs on every page (not just chapter-openers) so the reader always
    // has a small themed mark next to the running head — "animated icons
    // on each page" — reusing the same classifier/icon set as the big
    // chapter-opener icons below, since a page's kicker is literally that
    // section's title repeated across all of its pages (pages.json keeps
    // the two in lockstep; see classifyHeaderIcon's docstring). When this
    // specific page is about one specific chess piece, contentOverride
    // (from detectPieceIconFromContent) wins over the shared kicker text.
    kickerEl.innerHTML = '';
    if (!kickerText) return;
    var iconType = contentOverride || classifyHeaderIcon(kickerText);
    var iconSpan = document.createElement('span');
    iconSpan.className = 'kicker-icon animated-outline-icon';
    iconSpan.setAttribute('aria-hidden', 'true');
    iconSpan.innerHTML = getAnimatedOutlineIcon(iconType);
    kickerEl.appendChild(iconSpan);
    var textSpan = document.createElement('span');
    textSpan.textContent = kickerText;
    kickerEl.appendChild(textSpan);
  }

  function addAnimatedOutlineToContent(body) {
    // Most chapter-opening pages lead with <h1>, but roughly a third of
    // chapters in this manuscript paginate so their title lands as <h2>
    // (sometimes partway down a page that's still finishing the prior
    // chapter's tail). Fall back to the first <h2> so those chapters get
    // the same icon + typewriter treatment instead of silently getting none.
    var heading = body.querySelector('h1') || body.querySelector('h2');
    if (!heading) return;
    var headerText = heading.textContent || '';
    var iconType = classifyHeaderIcon(headerText);

    heading.innerHTML = '';
    var iconSpan = document.createElement('span');
    iconSpan.className = 'animated-outline-icon';
    iconSpan.setAttribute('aria-hidden', 'true'); // decorative — the heading text itself is the accessible content
    iconSpan.innerHTML = getAnimatedOutlineIcon(iconType);
    heading.appendChild(iconSpan);

    var textSpan = document.createElement('span');
    textSpan.className = 'tw-text';
    heading.appendChild(textSpan);
    typewriteText(textSpan, headerText, 26);
  }

  function addCoverVideoIntro(body) {
    // Appended into .page-content, which fillLeaf fully overwrites via
    // innerHTML on every render — so this never lingers on later pages,
    // and never stacks up if the reader flips back to the cover.
    var videoDiv = document.createElement('div');
    videoDiv.className = 'cover-video-intro';
    var video = document.createElement('video');
    video.src = VIDEO_INTRO;
    video.autoplay = true;
    video.muted = true;
    video.playsInline = true;
    video.setAttribute('preload', 'auto');
    video.style.width = '100%';
    video.style.height = '100%';
    video.style.objectFit = 'contain';
    videoDiv.appendChild(video);
    body.appendChild(videoDiv);
    // Some browsers only honor the autoplay attribute once metadata is
    // ready; explicitly requesting play() is the standard fallback and
    // its promise rejection (if autoplay is blocked) is safe to ignore —
    // the poster frame / fade-out still runs on schedule either way.
    var playAttempt = video.play();
    if (playAttempt && typeof playAttempt.catch === 'function') {
      playAttempt.catch(function () {});
    }
  }

  function applyCoverGreeting(body) {
    var name = loadName();
    var suit = loadSuit();
    if (!name && !suit) return;
    var g = document.createElement('div');
    g.className = 'cover-greet';
    if (suit) {
      g.innerHTML = '<img class="cover-greet-avatar" src="' + SUIT_INFO[suit.suit].img + '" alt="' + suit.suit + '">';
    }
    var bits = [];
    bits.push(name ? 'Welcome back, ' + escapeHtml(name) : 'Welcome back');
    if (suit) { bits.push(SUIT_INFO[suit.suit].glyph + ' ' + suit.suit); }
    var textSpan = document.createElement('span');
    textSpan.textContent = bits.join('  ·  ');
    g.appendChild(textSpan);
    body.appendChild(g);
  }

  function addResumeBanner(body) {
    var last = loadLastPage();
    if (last == null || last <= 0) return;
    var label = labelForPage(last);
    var banner = document.createElement('div');
    banner.className = 'resume-banner';
    var text = document.createElement('div');
    text.className = 'resume-banner-text';
    text.textContent = 'Continue where you left off' + (label ? ' — ' + label : '') + ' (page ' + (last + 1) + ' of ' + N + ')';
    banner.appendChild(text);
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'resume-banner-btn';
    btn.textContent = 'Resume Reading';
    btn.addEventListener('click', function () { goTo(last); });
    banner.appendChild(btn);
    body.appendChild(banner);
  }

  var wmCounter = 0;
  function addWatermark(leafEl) {
    // Faint, tiled, personalized watermark over every page — a deterrent
    // and a leak-tracer, not real protection: nothing a web page does can
    // stop an OS-level screenshot or a photo of the screen, and the raw
    // text of this book is already sitting in this file's own source. See
    // the contextmenu/copy/selection blocks below for the same honesty.
    // Rendered as an SVG tiled pattern (cheap, crisp at any zoom) rebuilt
    // on every fillLeaf call. Pattern <id> must be unique per render since
    // leafActive and leafUnder can both hold a live copy at once — a
    // shared id here would hit the same duplicate-id ambiguity bug as any
    // other per-leaf element in this file.
    var old = leafEl.querySelector('.page-watermark');
    if (old) old.remove();
    var inner = leafEl.querySelector('.page-inner');
    if (!inner) return;
    var name = loadName();
    var label = name ? ('PERSONAL COPY — ' + name.toUpperCase()) : 'PROTECTED COPY — NOT FOR DISTRIBUTION';
    wmCounter += 1;
    var patId = 'wmPat' + wmCounter + Math.random().toString(36).slice(2, 8);
    var wrap = document.createElement('div');
    wrap.className = 'page-watermark';
    wrap.setAttribute('aria-hidden', 'true');
    wrap.innerHTML = '<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">'
      + '<defs><pattern id="' + patId + '" patternUnits="userSpaceOnUse" width="300" height="150" patternTransform="rotate(-27)">'
      + '<text x="0" y="75" style="font-family:\'Archivo\',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:0.05em;fill:var(--ink);opacity:0.038;">' + escapeHtml(label) + '</text>'
      + '</pattern></defs>'
      + '<rect width="100%" height="100%" fill="url(#' + patId + ')"></rect>'
      + '</svg>';
    inner.appendChild(wrap);
  }

  function addMoveJournal(body, page) {
    // Wrapping (implicit) label association rather than id/for — both leaves
    // can hold this same page's markup at once (see fillLeaf/goTo), so a
    // shared id would make label-click focus whichever copy comes first in
    // the DOM instead of the one actually on screen.
    var slug = slugify(page.kicker || '');
    var wrap = document.createElement('div');
    wrap.className = 'move-journal';
    wrap.innerHTML = '<label class="move-journal-field">'
      + '<span class="move-journal-label">Your move</span>'
      + '<textarea class="move-journal-input" rows="3" placeholder="Write it down — it stays on this device."></textarea>'
      + '</label>'
      + '<div class="move-journal-status" aria-live="polite"></div>';
    body.appendChild(wrap);
    var ta = wrap.querySelector('textarea');
    var status = wrap.querySelector('.move-journal-status');
    ta.value = loadMoveAnswer(slug);
    var timer = null;
    ta.addEventListener('input', function () {
      status.classList.remove('visible');
      clearTimeout(timer);
      timer = setTimeout(function () {
        saveMoveAnswer(slug, ta.value);
        status.textContent = 'Saved';
        status.classList.add('visible');
      }, 500);
    });
  }

  function fillLeaf(leafEl, page) {
    var kicker = leafEl.querySelector('.page-kicker');
    var body = leafEl.querySelector('.page-content');
    var footer = leafEl.querySelector('.page-footer');
    leafEl.className = leafEl.className.replace(/\b(cover|move|prose|figure|quiz|epigraph)\b/g, '').trim();
    leafEl.classList.add(page.type);
    leafEl.classList.toggle('dark-page', !!page.dark);
    var pieceOverride = page.type === 'prose' ? detectPieceIconFromContent(page.html) : null;
    addKickerIcon(kicker, page.type === 'cover' ? '' : (page.kicker || ''), pieceOverride);
    if (page.type === 'quiz') {
      renderQuizInto(body);
    } else {
      body.innerHTML = page.html;
      if (page.type === 'cover') { applyCoverGreeting(body); addResumeBanner(body); }
      if (page.type === 'prose') {
        var isBoxPage = page.kicker && (page.kicker.indexOf('The Box Is Already Waiting') !== -1 || page.kicker.indexOf('The Same Box') !== -1);
        if (isBoxPage) { addOneLineBoxArt(body, page); }
        else if (page.is_section_start) { addSectionDividerMark(body); }
        addAnimatedOutlineToContent(body);
        addPieceDissolveArt(body, page, pieceOverride);
      }
      if (page.type === 'move') { addMoveJournal(body, page); }
      applySuitTag(body, page);
    }
    var pnum = PAGES.indexOf(page) + 1;
    footer.innerHTML = page.type === 'cover'
      ? ''
      : '<span>TRIPLE CH</span><span>' + pnum + '</span>';
    addWatermark(leafEl);
  }

  function render() {
    fillLeaf(leafActive, PAGES[current]);
    leafActive.style.transition = 'none';
    leafActive.style.transform = 'rotateY(0deg)';
    leafActive.classList.remove('origin-right');
    void leafActive.offsetWidth;
    leafActive.style.transition = '';
    updateChrome();
  }

  function updateChrome() {
    pageCounter.textContent = 'Page ' + (current + 1) + ' of ' + N;
    progressFill.style.width = (((current + 1) / N) * 100) + '%';
    prevZone.style.cursor = current === 0 ? 'default' : 'pointer';
    nextZone.style.cursor = current === N - 1 ? 'default' : 'pointer';
    // Quiz, figure and move pages all have real buttons/sliders/textareas
    // under the click-to-turn-page strips (each nav-zone is 34% wide, wide
    // enough to cover the edges of any full-width control) — suspend those
    // strips while one is showing so taps reach the control instead. Arrow
    // keys and edge-swipe still turn the page either way.
    var stage = document.getElementById('stage');
    var t = PAGES[current].type;
    if (stage) { stage.classList.toggle('no-nav', t === 'quiz' || t === 'figure' || t === 'move'); }
    saveLastPage(current);
  }

  function goTo(target) {
    if (animating || target === current || target < 0 || target > N - 1) return;
    animating = true;
    var forward = target > current;

    fillLeaf(leafUnder, PAGES[target]);

    leafActive.classList.toggle('origin-right', !forward);
    leafActive.style.transition = 'none';
    leafActive.style.transform = 'rotateY(0deg)';
    void leafActive.offsetWidth;
    leafActive.style.transition = '';

    requestAnimationFrame(function () {
      leafActive.style.transform = forward ? 'rotateY(-180deg)' : 'rotateY(180deg)';
    });

    var done = false;
    function onEnd(e) {
      if (e && e.target !== leafActive) return;
      if (done) return;
      done = true;
      leafActive.removeEventListener('transitionend', onEnd);
      current = target;
      fillLeaf(leafActive, PAGES[current]);
      leafActive.style.transition = 'none';
      leafActive.style.transform = 'rotateY(0deg)';
      leafActive.classList.remove('origin-right');
      void leafActive.offsetWidth;
      leafActive.style.transition = '';
      updateChrome();
      animating = false;
    }
    leafActive.addEventListener('transitionend', onEnd);
    setTimeout(onEnd, 750);
  }

  function next() { goTo(Math.min(current + 1, N - 1)); }
  function prev() { goTo(Math.max(current - 1, 0)); }

  prevZone.addEventListener('click', prev);
  nextZone.addEventListener('click', next);

  // ---- Casual copy-protection for the book pages -------------------------
  // Honest scope: this raises real friction against right-click-save,
  // drag-select-and-copy, and Print-to-PDF (the last one via the
  // @media print rule above). It does NOT and CANNOT stop an OS-level
  // screenshot, a phone camera pointed at the screen, or someone reading
  // this file's own source (the whole book is embedded as data a few
  // thousand lines up) — no web page can block any of those, on this site
  // or any other. Scoped to #stage only, so the reader's own typed
  // answers, search box, and Game Record overlay are never affected.
  var protectToastTimer = null;
  function showProtectToast(msg) {
    var el = document.getElementById('protectToast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'protectToast';
      el.className = 'protect-toast';
      el.setAttribute('role', 'status');
      document.body.appendChild(el);
    }
    el.textContent = msg;
    void el.offsetWidth;
    el.classList.add('visible');
    clearTimeout(protectToastTimer);
    protectToastTimer = setTimeout(function () { el.classList.remove('visible'); }, 2000);
  }
  var stageEl = document.getElementById('stage');
  stageEl.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    showProtectToast('This book is protected — right-click is disabled here.');
  });
  document.addEventListener('copy', function (e) {
    var active = document.activeElement;
    var inForm = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA');
    if (inForm) return; // let the reader copy their own typed text freely
    // user-select:none on .page-inner stops most selection before it
    // starts; this checks the actual selection anchor (not activeElement,
    // which is often just <body> during a plain text selection) as a
    // second layer for whatever slips through that — Ctrl+A, or a browser
    // that ignores user-select.
    var sel = window.getSelection ? window.getSelection() : null;
    var node = sel && sel.anchorNode;
    var el = node ? (node.nodeType === 1 ? node : node.parentElement) : null;
    if (el && el.closest && el.closest('#stage')) {
      e.preventDefault();
      showProtectToast('Copying this book’s text isn’t available.');
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === ' ') { next(); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { prev(); e.preventDefault(); }
    else if (e.key === 'Escape') { closeToc(); closeRecord(); }
  });

  var touchStartX = null;
  document.getElementById('stage').addEventListener('touchstart', function (e) {
    touchStartX = e.touches[0].clientX;
  }, { passive: true });
  document.getElementById('stage').addEventListener('touchend', function (e) {
    if (touchStartX === null) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 40) { dx < 0 ? next() : prev(); }
    touchStartX = null;
  }, { passive: true });

  // ---------- TOC ----------
  var tocOverlay = document.getElementById('tocOverlay');
  var tocList = document.getElementById('tocList');
  var tocBtn = document.getElementById('tocBtn');
  var tocClose = document.getElementById('tocClose');

  TOC.forEach(function (entry) {
    var btn = document.createElement('button');
    btn.className = 'toc-item lvl-' + entry.level;
    var label = document.createElement('span');
    label.textContent = entry.label;
    btn.appendChild(label);
    if (entry.level !== 0) {
      var pg = document.createElement('span');
      pg.className = 'toc-pg';
      pg.textContent = String(entry.page_index + 1);
      btn.appendChild(pg);
    }
    btn.addEventListener('click', function () {
      closeToc();
      goTo(entry.page_index);
    });
    tocList.appendChild(btn);
  });

  function openToc() { tocOverlay.classList.add('open'); tocSearchInput.value = ''; renderSearch(''); }
  function closeToc() { tocOverlay.classList.remove('open'); }
  tocBtn.addEventListener('click', openToc);
  tocClose.addEventListener('click', closeToc);
  tocOverlay.addEventListener('click', function (e) { if (e.target === tocOverlay) closeToc(); });

  // ---------- Search (inside the Contents panel) ----------
  var tocSearchInput = document.getElementById('tocSearchInput');
  var tocSearchResults = document.getElementById('tocSearchResults');
  var SEARCH_INDEX = PAGES.map(function (p, i) {
    return { i: i, title: p.kicker || (p.type === 'cover' ? 'Cover' : 'Untitled'), text: stripHtml(p.html || '').toLowerCase(), raw: stripHtml(p.html || '') };
  });
  function renderSearch(query) {
    query = (query || '').trim();
    if (!query) {
      tocSearchResults.innerHTML = '';
      tocSearchResults.style.display = 'none';
      tocList.style.display = '';
      return;
    }
    tocList.style.display = 'none';
    tocSearchResults.style.display = '';
    var q = query.toLowerCase();
    var matches = [];
    for (var j = 0; j < SEARCH_INDEX.length && matches.length < 30; j++) {
      var entry = SEARCH_INDEX[j];
      var pos = entry.text.indexOf(q);
      if (pos !== -1) matches.push({ entry: entry, pos: pos });
    }
    if (!matches.length) {
      tocSearchResults.innerHTML = '<div class="search-no-results">No matches for &ldquo;' + escapeHtml(query) + '&rdquo;.</div>';
      return;
    }
    tocSearchResults.innerHTML = matches.map(function (m) {
      var raw = m.entry.raw;
      var start = Math.max(0, m.pos - 50);
      var end = Math.min(raw.length, m.pos + q.length + 60);
      var snippet = (start > 0 ? '…' : '') + raw.slice(start, end) + (end < raw.length ? '…' : '');
      var snippetLower = snippet.toLowerCase();
      var mpos = snippetLower.indexOf(q);
      var snippetHtml = mpos !== -1
        ? escapeHtml(snippet.slice(0, mpos)) + '<mark>' + escapeHtml(snippet.slice(mpos, mpos + q.length)) + '</mark>' + escapeHtml(snippet.slice(mpos + q.length))
        : escapeHtml(snippet);
      return '<button type="button" class="search-result-item" data-page="' + m.entry.i + '">'
        + '<div class="search-result-title">' + escapeHtml(m.entry.title) + '</div>'
        + '<div class="search-result-snippet">' + snippetHtml + '</div>'
        + '</button>';
    }).join('');
    Array.prototype.forEach.call(tocSearchResults.querySelectorAll('.search-result-item'), function (btn) {
      btn.addEventListener('click', function () {
        closeToc();
        goTo(parseInt(btn.getAttribute('data-page'), 10));
      });
    });
  }
  var searchTimer = null;
  tocSearchInput.addEventListener('input', function () {
    clearTimeout(searchTimer);
    var val = tocSearchInput.value;
    searchTimer = setTimeout(function () { renderSearch(val); }, 150);
  });

  // ---------- Your Game Record ----------
  var recordOverlay = document.getElementById('recordOverlay');
  var recordBtn = document.getElementById('recordBtn');
  var recordClose = document.getElementById('recordClose');
  var recordContent = document.getElementById('recordContent');
  function buildGameRecordHTML() {
    var name = loadName();
    var suit = loadSuit();
    var html = '<div class="record-label">Reader</div><div class="record-value">' + (name ? escapeHtml(name) : 'Not named yet') + '</div>';
    if (suit) {
      var info = SUIT_INFO[suit.suit];
      html += '<div class="record-label">Suit</div><div class="record-value" style="color:' + info.color + '">' + info.glyph + ' ' + suit.suit + '</div>'
        + '<div class="record-note">Gift: ' + escapeHtml(info.gift) + '<br>Risk: ' + escapeHtml(info.risk) + '</div>';
    } else {
      html += '<div class="record-label">Suit</div><div class="record-note">Not taken yet — find the diagnostic near the start of the book.</div>';
    }
    html += '<div class="record-label">Your Moves</div>';
    moveEntries().forEach(function (m) {
      html += '<div class="record-move"><div class="record-move-title">' + escapeHtml(m.kicker) + '</div>'
        + '<div class="record-move-answer">' + (m.answer ? escapeHtml(m.answer).replace(/\n/g, '<br>') : '<em>Not written yet.</em>') + '</div></div>';
    });
    return html;
  }
  function buildGameRecordText() {
    var name = loadName(), suit = loadSuit(), lines = [];
    lines.push('TRIPLE CH — Your Game Record', '');
    lines.push('Reader: ' + (name || '—'));
    if (suit) {
      var info = SUIT_INFO[suit.suit];
      lines.push('Suit: ' + suit.suit + ' (' + info.glyph + ')', 'Gift: ' + info.gift, 'Risk: ' + info.risk);
    }
    lines.push('', 'YOUR MOVES');
    moveEntries().forEach(function (m) {
      lines.push('- ' + m.kicker, '  ' + (m.answer || '(not written yet)'), '');
    });
    return lines.join('\n');
  }
  function openRecord() { recordContent.innerHTML = buildGameRecordHTML(); recordOverlay.classList.add('open'); }
  function closeRecord() { recordOverlay.classList.remove('open'); }
  recordBtn.addEventListener('click', openRecord);
  recordClose.addEventListener('click', closeRecord);
  recordOverlay.addEventListener('click', function (e) { if (e.target === recordOverlay) closeRecord(); });

  window.__copyRecord = function () {
    var text = buildGameRecordText();
    var status = document.getElementById('recordCopyStatus');
    function show(msg) { if (status) { status.textContent = msg; status.classList.add('visible'); } }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { show('Copied to clipboard.'); }, function () { show('Could not copy automatically — select and copy manually.'); });
      } else {
        show('Could not copy automatically — select and copy manually.');
      }
    } catch (e) { show('Could not copy automatically — select and copy manually.'); }
  };
  window.__printRecord = function () {
    try { window.print(); } catch (e) {}
  };

  var textSizeBtn = document.getElementById('textSizeBtn');
  function applyTextSize(isLarge) {
    document.body.classList.toggle('text-large', isLarge);
    textSizeBtn.setAttribute('aria-pressed', isLarge ? 'true' : 'false');
    textSizeBtn.title = isLarge ? 'Back to standard text size' : 'Larger text, more space between lines';
  }
  applyTextSize(loadTextSize());
  textSizeBtn.addEventListener('click', function () {
    var next = !document.body.classList.contains('text-large');
    applyTextSize(next);
    saveTextSize(next);
  });

  // ---- Listen: read the current page aloud with the browser's built-in
  // voice, then automatically turn the page and keep going, like an
  // audiobook. Everything runs client-side (Web Speech API); nothing is
  // uploaded or generated server-side, so there is no audio file to host.
  (function () {
    var listenBtn = document.getElementById('listenBtn');
    var listenBtnLabel = document.getElementById('listenBtnLabel');
    var listenSpeedBtn = document.getElementById('listenSpeedBtn');
    var listenSpeedLabel = document.getElementById('listenSpeedLabel');
    var ttsSupported = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
    var ttsState = 'idle'; // idle | playing | paused
    var ttsQueue = [];
    var ttsQueueIndex = 0;
    var ttsRates = [0.85, 1, 1.15, 1.35];
    var ttsRateIndex = 1;
    var ttsVoice = null;
    var ttsGeneration = 0; // bumped every time we deliberately cancel speech;
      // any in-flight utterance's onend/onerror checks this against the
      // generation it was created with and ignores itself if a newer one
      // has since started. A single reusable "ignore the next callback"
      // flag looked simpler but is wrong: cancel() with nothing actually
      // speaking never fires a callback to consume that flag, so it sat
      // there and silently ate the FIRST real onend of the new reading
      // instead — killing playback after exactly one chunk (the heading,
      // since it comes first) every single time. A generation counter
      // ignores however many stale callbacks show up (zero, one, or more)
      // without ever mis-firing on a legitimate one.
    var ttsAutoNavigating = false;
    var ttsCurrentUtterance = null; // keep a live reference; several browsers
      // (notably Chrome) silently garbage-collect an utterance that has no
      // other reference, which kills its onend callback after the first
      // chunk and makes playback look like it stopped after one line.
    var ttsKeepAliveTimer = null; // Chrome also auto-stops synthesis after
      // ~15s of continuous speech; a periodic pause/resume nudge prevents that.

    function pickVoice() {
      var voices = (window.speechSynthesis.getVoices && window.speechSynthesis.getVoices()) || [];
      ttsVoice = voices.filter(function (v) { return /^en-us/i.test(v.lang); })[0]
        || voices.filter(function (v) { return /^en/i.test(v.lang); })[0]
        || voices[0] || null;
    }

    function splitIntoChunks(text) {
      var lines = String(text || '').split(/\n+/).map(function (s) { return s.trim(); }).filter(Boolean);
      var chunks = [];
      lines.forEach(function (line) {
        var sentences = line.match(/[^.!?]+[.!?]*(?:\s+|$)/g) || [line];
        sentences.forEach(function (s) {
          s = s.trim();
          if (s) chunks.push(s);
        });
      });
      return chunks;
    }

    function currentPageText() {
      var el = document.querySelector('.leaf-active .page-content');
      return el ? el.innerText : '';
    }

    function updateListenUI() {
      if (!listenBtn) return;
      listenBtn.setAttribute('aria-pressed', ttsState === 'playing' ? 'true' : 'false');
      if (listenBtnLabel) {
        listenBtnLabel.textContent = ttsState === 'playing' ? 'Pause' : (ttsState === 'paused' ? 'Resume' : 'Listen');
      }
      listenBtn.title = ttsState === 'playing' ? 'Pause reading' : (ttsState === 'paused' ? 'Resume reading' : 'Listen to this page');
    }

    function speakChunk() {
      var myGeneration = ttsGeneration;
      if (ttsQueueIndex >= ttsQueue.length) {
        if (current < N - 1) {
          ttsAutoNavigating = true;
          goTo(current + 1);
          ttsAutoNavigating = false;
          setTimeout(function () {
            if (ttsState === 'playing') startReadingCurrentPage();
          }, 820);
        } else {
          stopListening();
        }
        return;
      }
      var utter = new SpeechSynthesisUtterance(ttsQueue[ttsQueueIndex]);
      utter.rate = ttsRates[ttsRateIndex];
      if (ttsVoice) utter.voice = ttsVoice;
      utter.onend = function () {
        if (myGeneration !== ttsGeneration) return;
        if (ttsState !== 'playing') return;
        ttsQueueIndex++;
        speakChunk();
      };
      utter.onerror = function () {
        if (myGeneration !== ttsGeneration) return;
        if (ttsState !== 'playing') return;
        ttsQueueIndex++;
        speakChunk();
      };
      ttsCurrentUtterance = utter;
      window.speechSynthesis.speak(utter);
    }

    function startKeepAlive() {
      stopKeepAlive();
      ttsKeepAliveTimer = setInterval(function () {
        if (ttsState === 'playing' && window.speechSynthesis.speaking) {
          window.speechSynthesis.pause();
          window.speechSynthesis.resume();
        }
      }, 10000);
    }

    function stopKeepAlive() {
      if (ttsKeepAliveTimer) { clearInterval(ttsKeepAliveTimer); ttsKeepAliveTimer = null; }
    }

    function startReadingCurrentPage() {
      ttsGeneration++;
      try { window.speechSynthesis.cancel(); } catch (e) {}
      ttsQueue = splitIntoChunks(currentPageText());
      ttsQueueIndex = 0;
      speakChunk();
    }

    function startListening() {
      if (!ttsSupported) return;
      ttsState = 'playing';
      updateListenUI();
      startKeepAlive();
      startReadingCurrentPage();
    }

    function pauseListening() {
      if (!ttsSupported) return;
      ttsState = 'paused';
      ttsGeneration++;
      stopKeepAlive();
      try { window.speechSynthesis.cancel(); } catch (e) {}
      updateListenUI();
    }

    function resumeListening() {
      if (!ttsSupported) return;
      ttsState = 'playing';
      updateListenUI();
      startKeepAlive();
      speakChunk();
    }

    function stopListening() {
      ttsState = 'idle';
      ttsGeneration++;
      stopKeepAlive();
      try { window.speechSynthesis.cancel(); } catch (e) {}
      updateListenUI();
    }

    if (listenBtn) {
      if (!ttsSupported) {
        listenBtn.setAttribute('disabled', 'true');
        listenBtn.title = "Voice playback isn't supported in this browser";
        if (listenSpeedBtn) listenSpeedBtn.setAttribute('disabled', 'true');
      } else {
        pickVoice();
        if ('onvoiceschanged' in window.speechSynthesis) {
          window.speechSynthesis.onvoiceschanged = pickVoice;
        }
        listenBtn.addEventListener('click', function () {
          if (ttsState === 'idle') startListening();
          else if (ttsState === 'playing') pauseListening();
          else resumeListening();
        });
        if (listenSpeedBtn) {
          listenSpeedBtn.addEventListener('click', function () {
            ttsRateIndex = (ttsRateIndex + 1) % ttsRates.length;
            if (listenSpeedLabel) listenSpeedLabel.textContent = ttsRates[ttsRateIndex] + 'x';
            if (ttsState === 'playing') {
              ttsGeneration++;
              try { window.speechSynthesis.cancel(); } catch (e) {}
              speakChunk();
            }
          });
        }
        document.addEventListener('visibilitychange', function () {
          if (document.hidden && ttsState === 'playing') pauseListening();
        });
      }
    }

    // Stop reading if the visitor manually turns the page, opens the TOC,
    // jumps to a bookmark, etc.; all of those funnel through goTo(), so
    // wrapping it once here covers every navigation path. Our own
    // auto-advance (above) sets ttsAutoNavigating so it doesn't stop itself.
    var _origGoTo = goTo;
    goTo = function (target) {
      if (!ttsAutoNavigating && ttsState !== 'idle') { stopListening(); }
      return _origGoTo(target);
    };
  })();

  window.__goTo = goTo; // QA/debug hook, harmless in production

  render();
})();
</script>
